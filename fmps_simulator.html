<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panduit FMPS to Cisco Switch Architecture Simulator</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --panduit: #00838f;
            --cisco: #049fd9;
            --green: #22c55e;
            --red: #ef4444;
            --text: #f8fafc;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: var(--panel);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { margin-top: 0; font-size: 1.4rem; text-align: center; color: var(--accent); }
        .subtitle { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-top: -10px; margin-bottom: 20px; }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.25);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.85rem; color: #94a3b8; font-weight: 500; }
        select, input, button {
            background: #334155;
            color: var(--text);
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        button {
            background: var(--accent);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin-top: auto;
        }
        button:hover { opacity: 0.9; }
        canvas {
            width: 100%;
            height: 340px;
            background: #020617;
            border-radius: 8px;
            display: block;
            border: 1px solid #334155;
        }
        .status-bar {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            background: #1e293b;
            border: 1px solid #334155;
            font-size: 0.95rem;
        }
        .status-normal { color: var(--green); border-color: var(--green); background: rgba(34, 197, 94, 0.05); }
        .status-fault { color: var(--red); border-color: var(--red); background: rgba(239, 68, 68, 0.1); }
    </style>
</head>
<body>

<div class="container">
    <h1>Panduit FMPS → Cisco Switch Architecture Simulator</h1>
    <div class="subtitle">Class 4 Fault Managed Power Transmission (Tx → Rx) feeding 48V DC to Endpoint Network Hardware</div>
    
    <div class="controls">
        <div class="control-group">
            <label for="faultType">Simulate Line Condition</label>
            <select id="faultType">
                <option value="none">Normal Operation</option>
                <option value="human">Human Contact Fault (Class 4 Line)</option>
                <option value="short">Short Circuit Fault (Class 4 Line)</option>
            </select>
        </div>
        <div class="control-group">
            <label for="voltage">FMPS Transmission Voltage: <span id="voltVal">380</span>V DC</label>
            <input type="range" id="voltage" min="300" max="450" value="380" step="10">
        </div>
        <div class="control-group">
            <button id="resetBtn">Reset System</button>
        </div>
    </div>

    <canvas id="simCanvas" width="850" height="340"></canvas>

    <div id="statusBar" class="status-bar status-normal">
        Status: Panduit FMPS Active | 380V DC Packets → Panduit Rx Converting → 48V DC Output Active → Cisco Switch ONLINE
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const faultSelect = document.getElementById('faultType');
    const voltageSlider = document.getElementById('voltage');
    const voltVal = document.getElementById('voltVal');
    const resetBtn = document.getElementById('resetBtn');
    const statusBar = document.getElementById('statusBar');

    let packets = [];
    let isTripped = false;

    voltageSlider.addEventListener('input', () => {
        voltVal.textContent = voltageSlider.value;
        if(!isTripped) updateStatusNormal();
    });

    faultSelect.addEventListener('change', () => {
        if (faultSelect.value !== 'none' && !isTripped) {
            triggerFault();
        } else if (faultSelect.value === 'none') {
            resetSystem();
        }
    });

    resetBtn.addEventListener('click', resetSystem);

    function updateStatusNormal() {
        statusBar.className = 'status-bar status-normal';
        statusBar.innerHTML = `Status: Panduit FMPS Active | ${voltageSlider.value}V DC Packets → Panduit Rx Converting → 48V DC Output Active → Cisco Switch ONLINE`;
    }

    function triggerFault() {
        isTripped = true;
        const faultName = faultSelect.value === 'human' ? 'Human Contact' : 'Direct Line Short';
        statusBar.className = 'status-bar status-fault';
        statusBar.innerHTML = `⚠️ CLASS 4 FAULT DETECTED (${faultName}) — Panduit Tx Shut Down Power in < 2.0 ms! 48V DC Output Cut → Cisco Switch OFFLINE`;
    }

    function resetSystem() {
        isTripped = false;
        faultSelect.value = 'none';
        packets = [];
        updateStatusNormal();
    }

    function drawSystem() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. PANDUIT TRANSMITTER (Tx)
        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.fillRect(30, 80, 140, 130);
        ctx.strokeRect(30, 80, 140, 130);
        
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(30, 80, 140, 24);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText('PANDUIT Tx', 65, 96);
        
        ctx.fillStyle = '#f8fafc';
        ctx.font = '12px sans-serif';
        ctx.fillText('FMPS Transmitter', 48, 125);
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(`${voltageSlider.value}V DC Packets`, 52, 150);
        
        // Tx Status LED
        ctx.fillStyle = isTripped ? '#ef4444' : '#22c55e';
        ctx.beginPath();
        ctx.arc(100, 180, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#94a3b8';
        ctx.font = '10px sans-serif';
        ctx.fillText(isTripped ? 'FAULT TRIP' : 'TRANSMITTING', 65, 200);

        // 2. PANDUIT RECEIVER (Rx)
        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = '#0284c7';
        ctx.fillRect(410, 80, 140, 130);
        ctx.strokeRect(410, 80, 140, 130);

        ctx.fillStyle = '#0284c7';
        ctx.fillRect(410, 80, 140, 24);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText('PANDUIT Rx', 445, 96);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '12px sans-serif';
        ctx.fillText('FMPS Receiver', 438, 125);
        ctx.fillStyle = '#22c55e';
        ctx.fillText('Step-Down Converter', 420, 145);
        ctx.fillStyle = isTripped ? '#ef4444' : '#38bdf8';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('Output: 48V DC', 435, 170);

        // Rx Status LED
        ctx.fillStyle = isTripped ? '#ef4444' : '#22c55e';
        ctx.beginPath();
        ctx.arc(480, 190, 5, 0, Math.PI * 2);
        ctx.fill();

        // 3. CISCO SWITCH
        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = isTripped ? '#64748b' : '#049fd9';
        ctx.lineWidth = 2;
        ctx.fillRect(670, 80, 150, 130);
        ctx.strokeRect(670, 80, 150, 130);

        ctx.fillStyle = '#049fd9';
        ctx.fillRect(670, 80, 150, 24);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText('CISCO SWITCH', 705, 96);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '12px sans-serif';
        ctx.fillText('Catalyst Network Switch', 678, 125);
        ctx.fillStyle = isTripped ? '#ef4444' : '#22c55e';
        ctx.fillText(isTripped ? 'Power Lost (OFF)' : '48V DC Powered (ON)', 682, 145);

        // Render Cisco Switch Ports
        for(let row = 0; row < 2; row++) {
            for(let col = 0; col < 8; col++) {
                ctx.fillStyle = isTripped ? '#334155' : (Math.random() > 0.3 ? '#22c55e' : '#eab308');
                ctx.fillRect(685 + (col * 16), 165 + (row * 14), 10, 8);
            }
        }

        // --- CONDUCTORS & BUSES ---

        // Class 4 Line (Panduit Tx to Panduit Rx)
        ctx.strokeStyle = isTripped ? '#ef4444' : '#64748b';
        ctx.lineWidth = 3;
        
        ctx.beginPath();
        ctx.moveTo(170, 120);
        ctx.lineTo(410, 120);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(170, 160);
        ctx.lineTo(410, 160);
        ctx.stroke();

        ctx.fillStyle = '#94a3b8';
        ctx.font = '10px sans-serif';
        ctx.fillText('Class 4 FMPS Line (High Voltage Packets)', 200, 110);

        // 48V DC Power Feed (Panduit Rx to Cisco Switch)
        ctx.strokeStyle = isTripped ? '#475569' : '#38bdf8';
        ctx.lineWidth = 4;
        if(!isTripped) {
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 8;
        }
        ctx.beginPath();
        ctx.moveTo(550, 145);
        ctx.lineTo(670, 145);
        ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.fillStyle = isTripped ? '#64748b' : '#38bdf8';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText('48V DC Power Feed', 562, 135);

        // Fault visualizer on Class 4 Line
        if (faultSelect.value !== 'none') {
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(290, 120, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 10px sans-serif';
            ctx.fillText('FAULT LOCATED', 252, 98);
        }

        // Generate & Animate FMPS Energy Packets
        if (!isTripped) {
            if (Math.random() < 0.18) {
                packets.push({ x: 170 });
            }
        }

        for (let i = packets.length - 1; i >= 0; i--) {
            let p = packets[i];
            if (!isTripped) p.x += 4;

            // Draw Energy Packet
            ctx.fillStyle = isTripped ? '#ef4444' : '#22c55e';
            ctx.shadowColor = isTripped ? '#ef4444' : '#22c55e';
            ctx.shadowBlur = 8;
            ctx.fillRect(p.x, 115, 14, 10);
            ctx.shadowBlur = 0;

            if (p.x > 410 || (isTripped && p.x > 290)) {
                packets.splice(i, 1);
            }
        }

        // Oscilloscope Waveform (Packet Transmission Readout)
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(30, 240, 790, 70);
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        ctx.strokeRect(30, 240, 790, 70);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '10px sans-serif';
        ctx.fillText('FMPS Packet Pulse Telemetry (Tx Output Monitor)', 40, 255);

        ctx.strokeStyle = isTripped ? '#ef4444' : '#22c55e';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let x = 30; x < 820; x += 5) {
            let y = 285;
            if(!isTripped) {
                let pulse = Math.sin((x + performance.now() * 0.12) * 0.08);
                y += pulse > 0.6 ? -15 : (pulse < -0.6 ? 15 : 0);
            }
            if (x === 30) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();

        requestAnimationFrame(drawSystem);
    }

    drawSystem();
</script>
</body>
</html>
